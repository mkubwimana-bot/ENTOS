<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      padding: 1.5rem;
    }

    .game {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: #e94560;
    }

    .subtitle {
      color: #a0a0b0;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .message {
      font-size: 1.15rem;
      min-height: 3rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
      transition: color 0.2s;
    }

    .message.win {
      color: #4ecca3;
      font-weight: 600;
    }

    .message.hint-high {
      color: #ff6b6b;
    }

    .message.hint-low {
      color: #74b9ff;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #a0a0b0;
    }

    .stats strong {
      color: #e8e8e8;
      font-size: 1.1rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    input[type="number"] {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 1.1rem;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #e94560;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }

    button {
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    #guess-btn {
      background: #e94560;
      color: #fff;
    }

    #guess-btn:hover {
      background: #ff6b81;
    }

    #guess-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #new-game-btn {
      background: transparent;
      color: #a0a0b0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      margin-top: 0.5rem;
    }

    #new-game-btn:hover {
      color: #e8e8e8;
      border-color: rgba(255, 255, 255, 0.35);
    }

    .history {
      margin-top: 1.5rem;
      text-align: left;
      font-size: 0.85rem;
      color: #707080;
      max-height: 120px;
      overflow-y: auto;
    }

    .history li {
      list-style: none;
      padding: 0.25rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Guess the Number</h1>
    <p class="subtitle">I'm thinking of a number between 1 and 100.</p>

    <p class="message" id="message">Enter your guess below!</p>

    <div class="stats">
      <span>Guesses: <strong id="guess-count">0</strong></span>
      <span>Best: <strong id="best-score">—</strong></span>
    </div>

    <div class="input-row">
      <input type="number" id="guess-input" min="1" max="100" placeholder="1–100" autofocus>
      <button id="guess-btn">Guess</button>
    </div>

    <button id="new-game-btn">New Game</button>

    <ul class="history" id="history"></ul>
  </div>

  <script>
    const MIN = 1;
    const MAX = 100;
    const BEST_KEY = "numberGuessBest";

    let secret = 0;
    let guesses = 0;
    let gameOver = false;

    const messageEl = document.getElementById("message");
    const guessInput = document.getElementById("guess-input");
    const guessBtn = document.getElementById("guess-btn");
    const newGameBtn = document.getElementById("new-game-btn");
    const guessCountEl = document.getElementById("guess-count");
    const bestScoreEl = document.getElementById("best-score");
    const historyEl = document.getElementById("history");

    function loadBest() {
      const best = localStorage.getItem(BEST_KEY);
      bestScoreEl.textContent = best ? best : "—";
    }

    function startGame() {
      secret = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
      guesses = 0;
      gameOver = false;
      guessCountEl.textContent = "0";
      historyEl.innerHTML = "";
      messageEl.textContent = "Enter your guess below!";
      messageEl.className = "message";
      guessInput.value = "";
      guessInput.disabled = false;
      guessBtn.disabled = false;
      guessInput.focus();
    }

    function addHistory(guess, hint) {
      const li = document.createElement("li");
      li.textContent = `${guess} — ${hint}`;
      historyEl.prepend(li);
    }

    function submitGuess() {
      if (gameOver) return;

      const raw = guessInput.value.trim();
      if (raw === "") return;

      const guess = Number(raw);
      if (!Number.isInteger(guess) || guess < MIN || guess > MAX) {
        messageEl.textContent = `Please enter a whole number between ${MIN} and ${MAX}.`;
        messageEl.className = "message";
        return;
      }

      guesses++;
      guessCountEl.textContent = guesses;

      if (guess === secret) {
        gameOver = true;
        messageEl.textContent = `You got it! The number was ${secret} in ${guesses} guess${guesses === 1 ? "" : "es"}.`;
        messageEl.className = "message win";
        addHistory(guess, "Correct!");
        guessInput.disabled = true;
        guessBtn.disabled = true;

        const best = localStorage.getItem(BEST_KEY);
        if (!best || guesses < Number(best)) {
          localStorage.setItem(BEST_KEY, String(guesses));
          bestScoreEl.textContent = guesses;
        }
        return;
      }

      if (guess > secret) {
        messageEl.textContent = `${guess} is too high. Try lower.`;
        messageEl.className = "message hint-high";
        addHistory(guess, "Too high");
      } else {
        messageEl.textContent = `${guess} is too low. Try higher.`;
        messageEl.className = "message hint-low";
        addHistory(guess, "Too low");
      }

      guessInput.value = "";
      guessInput.focus();
    }

    guessBtn.addEventListener("click", submitGuess);
    guessInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitGuess();
    });
    newGameBtn.addEventListener("click", startGame);

    loadBest();
    startGame();
  </script>
</body>
</html>
